<pre id="check-report" hidden></pre>
<script src="vendor/reveal/reveal.js"></script>
<script src="vendor/reveal/plugin/notes.js"></script>
<script>
Reveal.initialize({
  hash: true,
  width: 1280,
  height: 720,
  margin: 0,
  center: false,
  controls: false,
  progress: true,
  transition: "none",
  backgroundTransition: "none",
  plugins: [RevealNotes]
}).then(function () {
  if (/[?&]check\b/.test(location.search)) {
    return document.fonts.ready.then(checkLayout);
  }
});

// ?check: walk every slide and report content that leaves the safe area
// (outside the frame, under the CoC footer band, or over the sources line).
// Used by check.py; measured only after the web fonts have loaded.
function checkLayout() {
  var FOOTER = 54, report = [];
  Reveal.getSlides().forEach(function (section, index) {
    Reveal.slide(index);
    var frame = section.querySelector(".frame");
    var fr = frame.getBoundingClientRect(), s = fr.width / 1280, issues = [];
    var limit = frame.classList.contains("coc-dark") ? 720 : 720 - FOOTER;
    var src = frame.querySelector(".sources");
    if (src) { limit = Math.min(limit, (src.getBoundingClientRect().top - fr.top) / s); }
    frame.querySelectorAll("*").forEach(function (el) {
      if (el.classList.contains("body") ||
          el.closest(".coc-footer, .num, .sources, .skyline, aside") ||
          (el.closest("svg") && el.tagName.toLowerCase() !== "svg")) { return; }
      var r = el.getBoundingClientRect();
      if (!r.width || !r.height) { return; }
      var bottom = (r.bottom - fr.top) / s, right = (r.right - fr.left) / s;
      var top = (r.top - fr.top) / s, left = (r.left - fr.left) / s;
      if (bottom > limit + 1 || right > 1281 || top < -1 || left < -1) {
        issues.push(el.tagName.toLowerCase() + "." +
          (el.getAttribute("class") || "").replace(/ /g, ".") +
          " [" + Math.round(left) + "," + Math.round(top) + " - " +
          Math.round(right) + "," + Math.round(bottom) + "]");
      }
    });
    frame.querySelectorAll(".body").forEach(function (b) {
      if (b.scrollHeight > b.clientHeight + 1) {
        issues.push(".body overflows by " + (b.scrollHeight - b.clientHeight) + "px");
      }
    });
    if (issues.length) { report.push({ slide: index + 1, issues: issues.slice(0, 6) }); }
  });
  var out = document.getElementById("check-report");
  out.textContent = "CHECK-REPORT" + JSON.stringify(report) + "END-REPORT";
}
</script>
